<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILC Office</title>
<style>
:root{--bg:#e0e6ea;--pn:#fff;--tx:#1b2a36;--ac:#166a96;--bd:#c9d2d9}
.dk{--bg:#121a20;--pn:#1c262e;--tx:#e8eef2;--ac:#4aa3d4;--bd:#33424d}
*{box-sizing:border-box}body{margin:0;font:14px 'Noto Sans Tamil','Nirmala UI',Latha,system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column}
header{background:#166a96;color:#fff;display:flex;align-items:center;gap:10px;padding:6px 10px}
header b{font-size:16px;letter-spacing:1px;font-family:"Segoe Print","Chalkboard SE","Comic Sans MS","Noto Sans Tamil",sans-serif}header small{opacity:.85;letter-spacing:2px;font-size:10px;white-space:nowrap}@media(max-width:700px){header small{display:none}}#spl{position:fixed;inset:0;background:#e0e6ea;z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .6s}header button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
nav{display:flex;gap:4px;margin-left:8px;overflow:auto}nav button{font-size:13px;padding:5px 12px;border-radius:6px;background:#ffffff26}nav button.on{background:#fff;color:#166a96}
#tb{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd);align-items:center}
#tb button,#tb select,#tb input{padding:5px 9px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:5px;cursor:pointer;white-space:nowrap}
#tb input[type=color]{padding:0;width:30px;height:28px}
main{flex:1;overflow:auto;position:relative}section{display:none;min-height:100%}section.on{display:block}
#doc{background:#fff;color:#111;width:min(794px,96%);min-height:1050px;margin:16px auto;padding:60px 64px;box-shadow:0 2px 12px #0003;outline:0;line-height:1.5;font-size:12pt;font-family:'Noto Sans Tamil',Calibri,Arial,sans-serif}
#doc table,#cv table{border-collapse:collapse}#doc td,#doc th{border:1px solid #888;padding:6px;min-width:50px}
#doc img{max-width:100%}
#st{background:var(--pn);border-top:1px solid var(--bd);padding:3px 12px;font-size:12px;display:flex;justify-content:space-between}
#menu{position:fixed;top:0;left:-310px;width:300px;height:100%;background:var(--pn);z-index:20;transition:.2s;overflow:auto;box-shadow:2px 0 14px #0004;padding-bottom:30px}
#menu.on{left:0}#menu h4{margin:14px 14px 4px;color:var(--ac);font-size:12px;text-transform:uppercase}
#menu button{display:block;width:100%;text-align:left;padding:9px 18px;border:0;background:none;color:var(--tx);font-size:14px;cursor:pointer}#menu button:hover{background:var(--bg)}
#sc{position:fixed;inset:0;background:#0006;z-index:10;display:none}#sc.on{display:block}
#sg{width:100%;overflow:auto;padding:8px}#sg table{border-collapse:collapse;background:var(--pn)}
#sg th{background:var(--bg);font-weight:600;padding:3px 8px;border:1px solid var(--bd);position:sticky;top:0;font-size:12px}
#sg td{border:1px solid var(--bd);padding:0}#sg input{width:96px;border:0;padding:4px 5px;background:transparent;color:var(--tx);font:inherit}#sg input:focus{outline:2px solid var(--ac)}
#pw{display:flex;height:100%}#sl{width:150px;overflow:auto;padding:8px;background:var(--pn);border-right:1px solid var(--bd)}
#sl div{padding:8px;margin-bottom:8px;border:2px solid var(--bd);border-radius:6px;font-size:11px;height:70px;overflow:hidden;cursor:pointer;background:#fff;color:#111}#sl div.on{border-color:var(--ac)}
#ed{flex:1;overflow:auto;padding:16px}.cv{width:960px;height:540px;background:#fff;color:#111;box-shadow:0 2px 12px #0004;padding:50px 60px;outline:0;overflow:hidden;font-size:26px;transform-origin:0 0;position:relative}
.cv h1{font-size:54px;margin:0 0 20px;color:var(--h,#166a96);border-bottom:4px solid var(--a,transparent);padding-bottom:8px}
#pr{position:fixed;inset:0;background:#000;z-index:50;display:none;align-items:center;justify-content:center}#pr.on{display:flex}
#pf{width:100%;height:calc(100vh - 100px);border:0}
.hm{padding:40px;text-align:center}.hm h2{color:var(--ac)}
#pp{display:none}
@media print{body>*:not(main):not(#pp),#sl,#tb{display:none!important}main{overflow:visible}section{display:none!important}
body.pw #w{display:block!important}body.pw #doc{box-shadow:none;margin:0;width:100%}
body.ps #pp{display:block}body.ps #p{display:none!important}#pp .cv{page-break-after:always;transform:none;box-shadow:none;border:1px solid #ccc}}

#md{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:center;justify-content:center}#md.on{display:flex}
.bx{background:var(--pn);color:var(--tx);width:min(560px,94%);max-height:88vh;overflow:auto;border-radius:10px;box-shadow:0 8px 30px #0006}
.bh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#166a96;color:#fff;position:sticky;top:0}.bh button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.bb{padding:14px}.bb input,.bb select{width:100%;padding:7px;margin:3px 0;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx);font:inherit}.bb input[type=checkbox]{width:auto}.bb label{display:block;font-size:12px;margin-top:6px}
.row{display:flex;gap:6px}.pb{display:inline-block;background:#166a96;color:#fff;border:0;border-radius:6px;padding:8px 14px;margin:6px 6px 0 0;cursor:pointer}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.li button{margin-left:4px;padding:4px 9px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:5px;cursor:pointer}
.sy{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.sy button{padding:7px 0;font-size:16px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:5px;cursor:pointer}
#ts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#166a96;color:#fff;padding:8px 16px;border-radius:20px;z-index:70;display:none}#ts.on{display:block}
#doc[data-wm]:not([data-wm=""])::before{content:attr(data-wm);position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:90px;color:#0000001a;font-weight:700;pointer-events:none;white-space:nowrap}
.cv img.mv,.cv .sh{cursor:move}#pr .mv,#pp .mv{border:0!important}
@media print{body.ps #pp .ip{page-break-after:always;text-align:center}body.ps #pp .ip img{max-width:100%;max-height:255mm}}

#tb{display:block;padding:0}.rb{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd)}.rb b{padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}.rb b.on{color:#166a96;border-bottom:3px solid #166a96}
.rc{display:flex;gap:4px;align-items:center;overflow-x:auto;padding:6px 10px}.sp{border-left:1px solid var(--bd);height:24px;margin:0 4px;flex:none}.rc small{white-space:nowrap}
#hm,#h{padding:20px}.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;max-width:960px;margin:auto}.tile{background:var(--pn);border-radius:14px;padding:16px;box-shadow:0 2px 10px #0002;border-top:6px solid var(--c)}.tile h3{margin:4px 0}.tile .ic{font-size:36px}
#h h3,#rcn{max-width:960px;margin:18px auto 6px}
.dz{display:inline-flex;align-items:center;justify-content:center;width:68px;height:40px;border:1px solid var(--bd);border-radius:5px;cursor:pointer;font-size:16px;flex:none}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dg .dz{width:100%;height:76px}
.fc header,.fc #tb,.fc #st{display:none}#xf{display:none;position:fixed;top:8px;right:8px;z-index:30;background:#166a96;color:#fff;border:0;border-radius:16px;padding:6px 12px}.fc #xf{display:block}
#sg.ng td{border-color:transparent}.cv td{border:1px solid #888;padding:6px;font-size:22px}
.t-fade{animation:tf .7s}@keyframes tf{from{opacity:0}}.t-slide{animation:tsl .5s}@keyframes tsl{from{transform:translateX(80px);opacity:0}}.t-zoom{animation:tz .5s}@keyframes tz{from{transform:scale(.8);opacity:0}}.t-flip{animation:tfl .6s}@keyframes tfl{from{transform:rotateY(90deg)}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

function cml(){let seen={},h='';doc.querySelectorAll('.cm').forEach(e=>{if(seen[e.dataset.id])return;seen[e.dataset.id]=1;h+=`<div class="li"><span>${e.dataset.r=='1'?'✓ ':'💬 '}<b>${esc(e.dataset.a||'')}</b>: ${esc((e.dataset.t||'').slice(0,80))}<br><small>on "${esc(cmEl(e.dataset.id).map(x=>x.textContent).join('').slice(0,40))}"</small></span><span><button onclick="mc();cmGo('${e.dataset.id}')">Go</button><button onclick="cmShow('${e.dataset.id}')">Open</button></span></div>`});md('Comments',h||'<p>No comments yet. Select text, then tap 💬 Comment.</p>')}
function cmGo(id){let e=cmEl(id)[0];if(e){go('w');e.scrollIntoView({block:'center'})}}
doc.addEventListener('click',e=>{let c=e.target.closest&&e.target.closest('.cm');if(c)cmShow(c.dataset.id)});
/* track changes */
const mkTC=t=>{let e=document.createElement(t);e.className='tc';e.dataset.a=aut();e.dataset.d=new Date().toISOString();return e};
const inTC=(n,s)=>{let e=n&&(n.nodeType==3?n.parentNode:n);return e&&e.closest?e.closest(s||'ins.tc,del.tc'):null};
function tcg(){TCK=!TCK;if(TCK)aut();toast('Track changes '+(TCK?'ON – your edits are marked':'OFF'));tb()}
function tcIns(text){let g=getSelection(),r=g.getRangeAt(0),d=inTC(r.startContainer,'del.tc');if(d){r=document.createRange();r.setStartAfter(d);r.collapse(true)}
let el=mkTC('ins'),tn=document.createTextNode(text);el.appendChild(tn);r.insertNode(el);let q=document.createRange();q.setStart(tn,tn.length);q.collapse(true);g.removeAllRanges();g.addRange(q);sv()}
function tcDel(g,type,after){if(g.isCollapsed){let fw=/Forward/.test(type),u=/Word/.test(type)?'word':/Line/.test(type)?'lineboundary':'character';g.modify('extend',fw?'forward':'backward',u)}
if(g.isCollapsed){TCB=true;document.execCommand(/Forward/.test(type)?'forwardDelete':'delete');TCB=false;return}
let rg=g.getRangeAt(0).cloneRange(),made=[],q;wrapR(rg,()=>mkTC('del'),m=>{if(inTC(m,'del.tc'))return true;let i=inTC(m,'ins.tc');if(i){let par=m.parentNode;m.remove();if(!i.textContent){i.remove()}return true}return false}).forEach(x=>made.push(x));
q=document.createRange();if(made.length){if(after||/Forward/.test(type)){q.setStartAfter(made[made.length-1])}else q.setStartBefore(made[0])}else{q.setStart(rg.startContainer,Math.min(rg.startOffset,rg.startContainer.length||0))}q.collapse(true);g.removeAllRanges();g.addRange(q);sv()}
doc.addEventListener('beforeinput',e=>{if(!TCK||TCB)return;let t=e.inputType,g=getSelection();if(!g.rangeCount)return;
if(/^delete/.test(t)){e.preventDefault();tcDel(g,t);return}
if(t=='insertText'&&e.data!=null){if(!g.isCollapsed){e.preventDefault();tcDel(g,'deleteContentBackward',1);tcIns(e.data);return}if(inTC(g.anchorNode,'ins.tc'))return;e.preventDefault();tcIns(e.data);return}
if(t=='insertFromPaste'||t=='insertFromDrop'){let d=e.dataTransfer&&e.dataTransfer.getData('text/plain');if(d){e.preventDefault();if(!g.isCollapsed)tcDel(g,'deleteContentBackward',1);tcIns(d)}}});
doc.addEventListener('compositionend',e=>{if(!TCK||TCB||!e.data)return;let g=getSelection();if(!g.rangeCount)return;let n=g.anchorNode,o=g.anchorOffset,L=e.data.length;if(n.nodeType!=3||inTC(n)||o<L||n.nodeValue.slice(o-L,o)!==e.data)return;
let m=n.splitText(o-L);if(m.length>L)m.splitText(L);let el=mkTC('ins');m.parentNode.insertBefore(el,m);el.appendChild(m);let r=document.createRange();r.setStart(m,m.length);r.collapse(true);g.removeAllRanges();g.addRange(r);sv()});
function tcl(){let L=[...doc.querySelectorAll('ins.tc,del.tc')];md('Review changes',(L.map((e,i)=>`<div class="li"><span>${e.tagName=='INS'?'<b style="color:#0a7d2c">＋ Added</b>':'<b style="color:#c0392b">－ Deleted</b>'}: ${esc(e.textContent.slice(0,60))}<br><small>${esc(e.dataset.a||'')} • ${new Date(e.dataset.d).toLocaleString()}</small></span><span><button onclick="tcr(${i},1)">✓</button><button onclick="tcr(${i},0)">✗</button></span></div>`).join('')||'<p>No tracked changes.</p>')+(L.length?'<button class="pb" onclick="tca(1)">✓ Accept all</button><button class="pb" onclick="tca(0)">✗ Reject all</button>':''))}
function tcOne(e,acc){let ins=e.tagName=='INS';if(ins==acc||(!ins&&!acc)){while(e.firstChild)e.parentNode.insertBefore(e.firstChild,e)}e.remove()}
function tcr(i,acc){let L=[...doc.querySelectorAll('ins.tc,del.tc')];if(L[i])tcOne(L[i],acc);doc.normalize();sv();tcl()}
function tca(acc){[...doc.querySelectorAll('ins.tc,del.tc')].forEach(e=>tcOne(e,acc));doc.normalize();sv();mc();toast(acc?'All changes accepted':'All changes rejected')}
{const rv=RB.w.Review;RB.w.Review=()=>rv()+SP+BB([['💬 Comment','cmt()','Comment on selected text'],['📋 Comments','cml()'],['🖊 Track changes: '+(TCK?'ON':'OFF'),'tcg()'],['🔎 Review changes','tcl()'],['✓ Accept all','tca(1)'],['✗ Reject all','tca(0)'],['👁 Show / hide markup',"doc.classList.toggle('nomark')"]])}
